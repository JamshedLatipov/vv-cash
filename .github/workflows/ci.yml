name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore vv-cash.slnx

      - name: Build
        run: dotnet build vv-cash.slnx -c Release --no-restore

      - name: Test
        run: dotnet test vv-cash.slnx -c Release --no-build --verbosity normal
