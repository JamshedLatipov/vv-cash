<!-- @dsCard group="Proffi POS" viewport="1440x820" name="Proffi POS — Register" subtitle="Interactive: sign in → ring up an order → split payment" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proffi POS</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); background: var(--background); }
  #app { height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel" src="./LoginScreen.jsx"></script>
<script type="text/babel" src="./PosScreen.jsx"></script>
<script type="text/babel" src="./PaymentScreen.jsx"></script>
<script type="text/babel">
const { Button } = window.ProffiPOSDesignSystem_12f41e;

function App() {
  const [screen, setScreen] = React.useState("login");
  const [total, setTotal] = React.useState(0);

  if (screen === "login") return <window.LoginScreen onLogin={() => setScreen("pos")} />;
  if (screen === "pos") return <window.PosScreen onPay={(t) => { setTotal(t); setScreen("pay"); }} />;
  if (screen === "pay") return <window.PaymentScreen total={total} onBack={() => setScreen("pos")} onConfirm={() => setScreen("done")} />;
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "24px", background: "var(--slate-50)" }}>
      <div style={{ width: "96px", height: "96px", borderRadius: "50%", background: "var(--emerald-100)", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <i className="mdi mdi-check" style={{ fontSize: "56px", color: "var(--emerald-600)" }}></i>
      </div>
      <div style={{ fontSize: "32px", fontWeight: 900, color: "var(--slate-900)" }}>Payment Complete</div>
      <div style={{ fontSize: "18px", color: "var(--slate-500)" }}>{total.toFixed(2)} collected • Order #8429</div>
      <Button size="lg" onClick={() => setScreen("pos")} icon={<i className="mdi mdi-plus" />}>New Order</Button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
